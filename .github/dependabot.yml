version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    ignore:
      # vue-tsc 3.3.12 still requires TypeScript's JS compiler entry, removed in 7.x.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
